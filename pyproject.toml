[project]
name = "quackrfss"
version = "0.1.0"
description = "BRFSS survey data pipeline → DuckDB. Clone, run, analyze."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyreadstat>=1.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "rich>=13",
    "click>=8.1",
]

[project.scripts]
quackrfss = "scripts.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "pandas>=2.2",
]
